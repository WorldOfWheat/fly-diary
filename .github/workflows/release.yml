name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        type: string

# Default to read-only; only the publish job gets write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A release tag can point at any commit, including one on a branch that
      # predates the test suites (e.g. master, which has no tests/ or test.sh).
      # Check out the tag itself so the tests match the code being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # pnpm must be installed before setup-node, otherwise `cache: pnpm`
      # cannot resolve `pnpm store path`. The version comes from the
      # `packageManager` field in package.json; declaring it here as well makes
      # pnpm/action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.98.1

      - run: pnpm install --frozen-lockfile
      - run: ./test.sh --no-cov

  audit:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    permissions:
      contents: read
      checks: write
      issues: write

  publish:
    needs: [test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: macos-latest
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # Configure required reviewers / protected branches on this environment in
    # the repository settings. It also gives signing secrets a scoped home.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Check out the same ref the test job validated, otherwise a
      # workflow_dispatch run with a tag input can leave the workspace empty
      # and pnpm/action-setup then fails with "No pnpm version is specified".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # pnpm must be installed before setup-node, otherwise `cache: pnpm`
      # cannot resolve `pnpm store path`. The version is pinned to the same
      # value as `packageManager` in package.json; declaring a *different*
      # version there makes pnpm/action-setup fail with
      # ERR_PNPM_BAD_PM_VERSION, and omitting it entirely makes the action
      # fail with "No pnpm version is specified" if package.json is missing.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.98.1

      - run: pnpm install --frozen-lockfile

      # No build cache here on purpose: release artifacts are built from a
      # clean target directory instead of restoring cache written by other
      # workflows.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Fly Diary ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false

      # SLSA-style provenance for every bundle produced on this runner. Users
      # can verify the artifacts with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "src-tauri/target/release/bundle/**/*"
