name: CI

on:
  pull_request:
    branches: [master]

# Least privilege: the test job never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change the
      # code that runs with this repository's token. Dependabot keeps them up
      # to date.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # pnpm must be installed before setup-node, otherwise `cache: pnpm`
      # cannot resolve `pnpm store path`. The version comes from the
      # `packageManager` field in package.json; declaring it here as well makes
      # pnpm/action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: pnpm

      # Pin the toolchain instead of tracking `stable`: a new Rust release
      # should never silently change what CI builds.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: ./test.sh --no-cov
