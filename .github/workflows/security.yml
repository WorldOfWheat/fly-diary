name: Security

on:
  pull_request:
    branches: [master]
  schedule:
    # Advisories appear after a dependency was merged, so re-audit weekly.
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Release calls this workflow so a tag cannot publish without passing the
  # same audits.
  workflow_call:
    inputs:
      ref:
        description: Git ref to audit
        required: false
        type: string

permissions:
  contents: read

jobs:
  rust-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  npm-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          cache: pnpm

      # `.npmrc` sets ignore-scripts, so this never executes dependency scripts.
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
