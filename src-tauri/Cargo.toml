[package]
name = "fly-diary"
version = "0.1.7"
description = "A simple one-entry-per-day diary app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fly_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }

# --- Encryption (RustCrypto) ---
aes-gcm = "0.10"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }

# --- XML storage format ---
quick-xml = "0.42"

# --- Parallel import ---
rayon = "1"

# --- Reading images from the OS clipboard (desktop only) ---
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3.6"
image = { version = "0.25", default-features = false, features = ["png"] }

# --- Disabling core dumps (Unix only) ---
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
