[package]
name = "fly-diary"
version = "2.1.0"
description = "A simple one-entry-per-day diary app"
authors = ["WorldOfWheat <me@worldofwheat.cc>"]
repository = "https://github.com/WorldOfWheat/fly-diary"
edition = "2021"
rust-version = "1.90.0"

[lib]
name = "fly_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fly-diary-biometric = { path = "plugins/biometric" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }

# --- Encryption (RustCrypto) ---
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
rand = "0.8"
base64 = "0.23"
zeroize = { version = "1", features = ["derive"] }

# --- Encrypted SQLite storage (SQLCipher) ---
rusqlite = { version = "0.43", features = ["bundled-sqlcipher-vendored-openssl"] }

# --- Legacy XML format (one-time migration only) ---
quick-xml = "0.42"

# --- Parallel import ---
rayon = "1"

# --- Resizing and re-encoding image attachments ---
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
webp = "0.3"

# --- Reading images from the OS clipboard (desktop only) ---
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3.6"

# --- Disabling core dumps (Unix only) ---
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
