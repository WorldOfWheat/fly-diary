[package]
name = "tauri-plugin-saf-sync"
version = "0.1.0"
authors = ["WorldOfWheat"]
description = "Android Storage Access Framework bridge for Fly Diary folder sync"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/android", "/permissions"]
links = "tauri-plugin-saf-sync"

[lib]
name = "tauri_plugin_saf_sync"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.12.5" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }
